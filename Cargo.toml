[package]
name = "manga-sama"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
# Already pulled in by ureq; encodes the file path handed to kitty.
base64 = "0.23.1"
# jpeg + webp: some pages are WebP files served with a .jpg name (e.g. Berserk 1/1).
image = { version = "0.25.10", default-features = false, features = ["jpeg", "webp"] }
# Already pulled in by ureq; needed to encode the title as a URL path segment.
percent-encoding = "2.3.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
scraper = "0.27.0"
serde_json = "1.0.151"
ureq = "3.4.2"
