[package]
name = "manga-sama"
version = "0.1.0"
edition = "2024"

[dependencies]
# jpeg + webp: some pages are WebP files served with a .jpg name (e.g. Berserk 1/1).
image = { version = "0.25.10", default-features = false, features = ["jpeg", "webp"] }
inquire = { version = "0.9.4", default-features = false, features = ["crossterm"] }
# Already pulled in by ureq; needed to encode the title as a URL path segment.
percent-encoding = "2.3.2"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
# No chafa (needs the system libchafa): kitty/sixel/iterm2 protocols, halfblocks as fallback.
ratatui-image = { version = "11.1.0", default-features = false, features = ["crossterm"] }
scraper = "0.27.0"
serde_json = "1.0.151"
ureq = "3.4.2"
